name: ljod
description: "A secure, modular, high-performance audio player built with Flutter."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Material Design 3
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management & DI
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Audio & Background Playback
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # Database & Local Storage
  path: ^1.9.0
  path_provider: ^2.1.2
  sqflite: ^2.3.2

  # Security & Storage
  flutter_secure_storage: ^9.0.0

  # Networking & Serialization
  dio: ^5.4.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
