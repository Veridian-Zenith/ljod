name: ljod
description: "A secure, modular, high-performance audio player forged by Veridian Zenith."
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # UI — the official Material UI package (Material 3 Expressive).
  # Flutter 3.47 moved package:flutter/material.dart into material_ui.
  material_ui: ^1.9.0

  # State management & DI
  flutter_riverpod: ^3.4.3

  # Audio & background playback
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_metadata_reader: ^1.8.1

  # Storage
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  sqflite: ^2.4.5

  # Networking (lyrics lookup)
  dio: ^5.11.1

  # Permissions
  permission_handler: ^13.0.2

  # Media session / notification integration
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-ExtraBold.ttf
          weight: 800
