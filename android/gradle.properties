# Keep the build inside a predictable footprint. The Kotlin daemon inherits the
# Gradle heap unless it is capped, and Gradle keeps a daemon (and its heap) for
# three hours by default, which is how a couple of builds ended up holding
# several gigabytes each. Caps here, plus the daemon JVM criteria in
# gradle/gradle-daemon-jvm.properties, keep one daemon on one JDK.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC --enable-native-access=ALL-UNNAMED
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
org.gradle.workers.max=4
org.gradle.daemon.idletimeout=600000
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.build-cache=true
org.gradle.configuration-cache=false
kotlin.incremental=true
android.enableR8.fullMode=true
android.sync.suppressAgpWarnings=DEBUGGABLE_AND_MINIFIED_ENABLED,UNSUPPORTED_PROJECT_OPTION_USE
org.gradle.tooling.parallel=true

# Release signing is configured in app/build.gradle.kts from
# ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PATH; credentials may live in the
# git-ignored local.properties. No keystore path belongs in this file.
android.builtInKotlin=true
# The new AGP DSL is the default in AGP 9; opting out of it is what made every
# `android { }` access a deprecation warning, and the opt-out is removed in
# AGP 10. The build file already uses the public DSL types, so nothing else here
# needs the legacy extension.
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
