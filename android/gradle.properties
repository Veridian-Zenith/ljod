org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.build-cache=true
org.gradle.configuration-cache=false
kotlin.incremental=true
android.enableR8.fullMode=true
android.sync.suppressAgpWarnings=DEBUGGABLE_AND_MINIFIED_ENABLED,UNSUPPORTED_PROJECT_OPTION_USE
org.gradle.tooling.parallel=true

# Release signing is configured in app/build.gradle.kts from
# ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PATH; credentials may live in the
# git-ignored local.properties. No keystore path belongs in this file.
android.builtInKotlin=true
android.newDsl=false
