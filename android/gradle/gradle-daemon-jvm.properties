#This file is generated by updateDaemonJvm
# Pins the Gradle daemon to a JDK 21 from Adoptium (Temurin), so a build started
# from an IDE, a shell with a different JAVA_HOME, or Android Studio's bundled JBR
# still runs the daemon on the toolchain the project targets. Criteria take
# precedence over JAVA_HOME and org.gradle.java.home. Generated by hand because
# `./gradlew updateDaemonJvm` wants toolchain download repositories configured,
# and this project only ever uses installed JDKs.
toolchainVersion=21
toolchainVendor=ADOPTIUM
