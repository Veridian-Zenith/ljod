name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# No permissions block: Forgejo does not support the `permissions` key and
# warns on every run, expecting capabilities to be granted through
# Authorized Integrations instead. Declaring it here did nothing.
# One run per branch/PR; a new push cancels the superseded run instead of
# queueing another five-minute debug build behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

# Forgejo resolves a bare `owner/action` against its own mirror
# (DEFAULT_ACTIONS_URL, data.forgejo.org), which mirrors the actions/* repos but
# not subosito/flutter-action — there a bare `subosito/flutter-action@v2` fails
# with "repository not found". The absolute URL below bypasses the mirror;
# actions/* stay bare so they keep using it. Expressions are not allowed in
# `uses:`, hence the repeated literal.
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The runner's tool cache is unpacked under /opt/hostedtoolcache by
      # another user, so git exits 128 with "dubious ownership" — fatal both to
      # the setup action and to the Flutter tool's own git calls. The path is
      # not known ahead of time, so the wildcard entry is the reliable form.
      - name: Trust the Flutter tool cache
        run: git config --global --add safe.directory '*'

      - name: Set up Flutter
        uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `flutter pub get` resolves plugin platform implementations and exits 1 with
      # "No Android SDK found. Try setting the ANDROID_HOME environment variable."
      # when none is installed, so even the analysis-only jobs need an SDK; the APK
      # jobs need one to build regardless. This image ships none, so install it at the
      # level compileSdk asks for (37).
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          sdk="${RUNNER_TEMP:-${HOME:-/tmp}}/android-sdk"
          manager="${sdk}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "${manager}" ]; then
            echo "Installing Android command-line tools into ${sdk}."
            tmp="$(dirname "${sdk}")/tmp-tools"
            mkdir -p "${sdk}/cmdline-tools" "${tmp}/unpacked"
            curl -fsSL -o "${tmp}/cmdline-tools.zip" \
              "https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip"
            if command -v unzip > /dev/null; then
              unzip -q "${tmp}/cmdline-tools.zip" -d "${tmp}/unpacked"
            else
              python3 -m zipfile -e "${tmp}/cmdline-tools.zip" "${tmp}/unpacked"
            fi
            rm -rf "${sdk}/cmdline-tools/latest"
            mv "${tmp}/unpacked/cmdline-tools" "${sdk}/cmdline-tools/latest"
            rm -rf "${tmp}"
          fi

          # The licence prompts read stdin; `yes` answers them. It dies of SIGPIPE
          # once sdkmanager stops reading, which is expected and not a failure.
          yes | "${manager}" --sdk_root="${sdk}" --licenses > /dev/null || true

          "${manager}" --sdk_root="${sdk}" --install \
            "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

          echo "ANDROID_HOME=${sdk}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${sdk}" >> "${GITHUB_ENV}"
          echo "Android SDK ready at ${sdk}"

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The runner's tool cache is unpacked under /opt/hostedtoolcache by
      # another user, so git exits 128 with "dubious ownership" — fatal both to
      # the setup action and to the Flutter tool's own git calls. The path is
      # not known ahead of time, so the wildcard entry is the reliable form.
      - name: Trust the Flutter tool cache
        run: git config --global --add safe.directory '*'

      - name: Set up Flutter
        uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `flutter pub get` resolves plugin platform implementations and exits 1 with
      # "No Android SDK found. Try setting the ANDROID_HOME environment variable."
      # when none is installed, so even the analysis-only jobs need an SDK; the APK
      # jobs need one to build regardless. This image ships none, so install it at the
      # level compileSdk asks for (37).
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          sdk="${RUNNER_TEMP:-${HOME:-/tmp}}/android-sdk"
          manager="${sdk}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "${manager}" ]; then
            echo "Installing Android command-line tools into ${sdk}."
            tmp="$(dirname "${sdk}")/tmp-tools"
            mkdir -p "${sdk}/cmdline-tools" "${tmp}/unpacked"
            curl -fsSL -o "${tmp}/cmdline-tools.zip" \
              "https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip"
            if command -v unzip > /dev/null; then
              unzip -q "${tmp}/cmdline-tools.zip" -d "${tmp}/unpacked"
            else
              python3 -m zipfile -e "${tmp}/cmdline-tools.zip" "${tmp}/unpacked"
            fi
            rm -rf "${sdk}/cmdline-tools/latest"
            mv "${tmp}/unpacked/cmdline-tools" "${sdk}/cmdline-tools/latest"
            rm -rf "${tmp}"
          fi

          # The licence prompts read stdin; `yes` answers them. It dies of SIGPIPE
          # once sdkmanager stops reading, which is expected and not a failure.
          yes | "${manager}" --sdk_root="${sdk}" --licenses > /dev/null || true

          "${manager}" --sdk_root="${sdk}" --install \
            "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

          echo "ANDROID_HOME=${sdk}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${sdk}" >> "${GITHUB_ENV}"
          echo "Android SDK ready at ${sdk}"

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --reporter expanded

  build:
    name: Debug APK
    # The APK is the expensive job; only build it once the cheap checks pass.
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The runner's tool cache is unpacked under /opt/hostedtoolcache by
      # another user, so git exits 128 with "dubious ownership" — fatal both to
      # the setup action and to the Flutter tool's own git calls. The path is
      # not known ahead of time, so the wildcard entry is the reliable form.
      - name: Trust the Flutter tool cache
        run: git config --global --add safe.directory '*'

      - name: Set up Flutter
        uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `flutter pub get` resolves plugin platform implementations and exits 1 with
      # "No Android SDK found. Try setting the ANDROID_HOME environment variable."
      # when none is installed, so even the analysis-only jobs need an SDK; the APK
      # jobs need one to build regardless. This image ships none, so install it at the
      # level compileSdk asks for (37).
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          sdk="${RUNNER_TEMP:-${HOME:-/tmp}}/android-sdk"
          manager="${sdk}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "${manager}" ]; then
            echo "Installing Android command-line tools into ${sdk}."
            tmp="$(dirname "${sdk}")/tmp-tools"
            mkdir -p "${sdk}/cmdline-tools" "${tmp}/unpacked"
            curl -fsSL -o "${tmp}/cmdline-tools.zip" \
              "https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip"
            if command -v unzip > /dev/null; then
              unzip -q "${tmp}/cmdline-tools.zip" -d "${tmp}/unpacked"
            else
              python3 -m zipfile -e "${tmp}/cmdline-tools.zip" "${tmp}/unpacked"
            fi
            rm -rf "${sdk}/cmdline-tools/latest"
            mv "${tmp}/unpacked/cmdline-tools" "${sdk}/cmdline-tools/latest"
            rm -rf "${tmp}"
          fi

          # The licence prompts read stdin; `yes` answers them. It dies of SIGPIPE
          # once sdkmanager stops reading, which is expected and not a failure.
          yes | "${manager}" --sdk_root="${sdk}" --licenses > /dev/null || true

          "${manager}" --sdk_root="${sdk}" --install \
            "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

          echo "ANDROID_HOME=${sdk}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${sdk}" >> "${GITHUB_ENV}"
          echo "Android SDK ready at ${sdk}"

      - name: Install dependencies
        run: flutter pub get

      # Debug signing uses the generated debug keystore, so no repository
      # secret is involved and fork PRs work unchanged.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ljod-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
