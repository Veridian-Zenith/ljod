name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# `contents: write` is required to create the GitHub release and attach the
# APKs to it; the build itself only needs to read the repository.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Check the tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')"
          name="${version%%+*}"
          if [ "v${name}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version ${version} (expected v${name})." >&2
            exit 1
          fi
          echo "Building ${name} from tag ${GITHUB_REF_NAME}."

      - name: Install dependencies
        run: flutter pub get

      # The keystore is passed as content, never as a path: nothing has to exist
      # in the repository, and the workflow never writes the key to a tracked
      # location. Gradle decodes it into its disposable build/ directory.
      # One APK per phone architecture, exactly like the Forgejo workflow: a
      # universal APK is every ABI's libapp.so and libflutter.so glued together,
      # which is where the 68.7 MiB build came from. x86_64 is emulator-only and
      # the largest of the three, so it is not built. armv7 stays: it covers
      # 32-bit hardware and 64-bit devices running a 32-bit userspace.
      #
      # --split-debug-info keeps DWARF out of the shipped libapp.so. The symbols
      # land in build/symbols and are deliberately not published.
      - name: Build signed APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty; refusing to publish an unsigned build." >&2
            exit 1
          fi
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm64,android-arm \
            --split-debug-info=build/symbols

      - name: Verify the APKs are signed
        run: |
          set -euo pipefail
          build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/app-*-release.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No per-ABI APK was produced." >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Verifying ${apk} ($(du -h "${apk}" | cut -f1))"
            "${build_tools}/apksigner" verify --verbose "${apk}"
          done

      - name: Remove the decoded keystore
        if: always()
        run: rm -rf android/.gradle-signing

      - name: Resolve artifact name
        id: artifact
        run: |
          set -euo pipefail
          name="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')"
          echo "name=ljod-${name}" >> "${GITHUB_OUTPUT}"

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30

      # The artifact above is only reachable from the Actions tab and expires;
      # this publishes the signed APKs where users can actually download them.
      # Re-running the workflow replaces the attached APKs instead of failing,
      # and clears the old universal name so a previous 68 MiB build cannot sit
      # beside the smaller per-ABI ones on the same tag.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          apks=()
          for source in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "${source}" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            apk="ljod-${version}-${abi}.apk"
            cp "${source}" "${apk}"
            apks+=("${apk}")
          done
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No per-ABI APK found to publish." >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; replacing its APKs."
            gh release upload "${GITHUB_REF_NAME}" "${apks[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${apks[@]}" \
              --title "Ljod ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
          if gh release delete-asset "${GITHUB_REF_NAME}" \
            "ljod-${version}.apk" --yes >/dev/null 2>&1; then
            echo "Removed the obsolete universal ljod-${version}.apk asset."
          fi
          gh release view "${GITHUB_REF_NAME}" --json url --jq '"Published " + .url'
