name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# No permissions block: Forgejo ignores it and warns on every run, granting
# the job token through Authorized Integrations instead. Publishing a release
# therefore depends on that integration having repository write access.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Absolute URL: Forgejo's action mirror (data.forgejo.org) does not carry
      # subosito/flutter-action, so a bare reference fails to resolve.
      #
      # It unpacks into /opt/hostedtoolcache owned by another user, so git
      # exits 128 with "dubious ownership" unless the directory is trusted.
      - name: Trust the Flutter tool cache
        run: git config --global --add safe.directory '*'

      - name: Set up Flutter
        uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Check the tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')"
          name="${version%%+*}"
          if [ "v${name}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version ${version} (expected v${name})." >&2
            exit 1
          fi
          echo "Building ${name} from tag ${GITHUB_REF_NAME}."

      # `flutter pub get` resolves plugin platform implementations and exits 1 with
      # "No Android SDK found. Try setting the ANDROID_HOME environment variable."
      # when none is installed, so even the analysis-only jobs need an SDK; the APK
      # jobs need one to build regardless. This image ships none, so install it at the
      # level compileSdk asks for (37).
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          sdk="${RUNNER_TEMP:-${HOME:-/tmp}}/android-sdk"
          manager="${sdk}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "${manager}" ]; then
            echo "Installing Android command-line tools into ${sdk}."
            tmp="$(dirname "${sdk}")/tmp-tools"
            mkdir -p "${sdk}/cmdline-tools" "${tmp}/unpacked"
            curl -fsSL -o "${tmp}/cmdline-tools.zip" \
              "https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip"
            if command -v unzip > /dev/null; then
              unzip -q "${tmp}/cmdline-tools.zip" -d "${tmp}/unpacked"
            else
              python3 -m zipfile -e "${tmp}/cmdline-tools.zip" "${tmp}/unpacked"
            fi
            rm -rf "${sdk}/cmdline-tools/latest"
            mv "${tmp}/unpacked/cmdline-tools" "${sdk}/cmdline-tools/latest"
            rm -rf "${tmp}"
          fi

          # The licence prompts read stdin; `yes` answers them. It dies of SIGPIPE
          # once sdkmanager stops reading, which is expected and not a failure.
          yes | "${manager}" --sdk_root="${sdk}" --licenses > /dev/null || true

          # The NDK is required, not optional: the `jni` plugin compiles native
          # code with `flutter.ndkVersion`, which is 28.2.13676358 on Flutter
          # 3.47.9. Without it Gradle pulls ~1 GB from dl.google.com mid-build.
          "${manager}" --sdk_root="${sdk}" --install \
            "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" \
            "ndk;28.2.13676358"

          echo "ANDROID_HOME=${sdk}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${sdk}" >> "${GITHUB_ENV}"
          echo "Android SDK ready at ${sdk}"

      - name: Install dependencies
        run: flutter pub get

      # A wrong key password otherwise surfaces only when Gradle reaches
      # packageRelease, minutes in, as "Failed to read key <alias> from store
      # ...: null" with no hint about which secret is wrong. Check the material
      # first, while the build is still cheap.
      - name: Verify the signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                      ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "$(printenv "${name}" || true)" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "Missing or empty repository secrets:${missing}" >&2
            echo "Add them under Settings -> Actions -> Secrets." >&2
            exit 1
          fi

          store="${RUNNER_TEMP:-/tmp}/signing-check.p12"
          csr="${RUNNER_TEMP:-/tmp}/signing-check.csr"
          trap 'rm -f "${store}" "${csr}"' EXIT

          if ! printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${store}"; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid base64." >&2
            exit 1
          fi
          echo "Keystore decoded: $(wc -c < "${store}") bytes."

          # Loading the store verifies its MAC, so this fails only on a wrong or
          # wrapped store password.
          if ! keytool -list -keystore "${store}" \
                 -storepass "${ANDROID_KEYSTORE_PASSWORD}" > /dev/null 2>&1; then
            echo "ANDROID_KEYSTORE_PASSWORD does not open the keystore." >&2
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PASSWORD opens the keystore."

          if ! keytool -list -keystore "${store}" -alias "${ANDROID_KEY_ALIAS}" \
                 -storepass "${ANDROID_KEYSTORE_PASSWORD}" > /dev/null 2>&1; then
            echo "ANDROID_KEY_ALIAS '${ANDROID_KEY_ALIAS}' is not in the keystore." >&2
            exit 1
          fi
          echo "ANDROID_KEY_ALIAS '${ANDROID_KEY_ALIAS}' is present."

          # A certificate request has to reach the private key, so this fails
          # exactly when the key password is wrong. It writes only a throwaway
          # file and needs no network.
          if ! keytool -certreq -keystore "${store}" \
                 -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
                 -alias "${ANDROID_KEY_ALIAS}" \
                 -keypass "${ANDROID_KEY_PASSWORD}" \
                 -file "${csr}" > /dev/null 2>&1; then
            echo "ANDROID_KEY_PASSWORD does not unlock '${ANDROID_KEY_ALIAS}'." >&2
            echo "This keystore is PKCS12, so the key password must equal" \
                 "ANDROID_KEYSTORE_PASSWORD." >&2
            exit 1
          fi
          echo "ANDROID_KEY_PASSWORD unlocks '${ANDROID_KEY_ALIAS}'."

      # The keystore is passed as content, never as a path: nothing has to exist
      # in the repository, and the workflow never writes the key to a tracked
      # location. Gradle decodes it into its disposable build/ directory.
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          "${build_tools}/apksigner" verify --verbose \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Remove the decoded keystore
        if: always()
        run: rm -rf android/.gradle-signing

      # No artifact upload: this runner identifies as GHES and the artifact
      # service is absent, so the step fails the job after a successful build.
      # The release asset below is the durable, user-facing copy anyway.

      # The artifact above is only reachable from the Actions tab and expires;
      # this publishes the signed APK where users can download it.
      #
      # GitHub's `gh release` speaks github.com only, so this talks to the
      # Forgejo REST API directly with the per-run job token. Re-running
      # replaces the attached APK instead of failing on a name clash.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api="${SERVER}/api/v1/repos/${REPO}"
          auth="Authorization: token ${TOKEN}"
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')"
          apk="ljod-${version%%+*}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${apk}"

          status="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -H "${auth}" "${api}/releases/tags/${TAG}")"
          if [ "${status}" = "404" ]; then
            echo "No release for ${TAG} yet; creating one."
            curl -sS -f -X POST "${api}/releases" \
              -H "${auth}" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"Ljod ${TAG}\"}" \
              > /tmp/release.json
          elif [ "${status}" != "200" ]; then
            echo "Could not look up the release for ${TAG} (HTTP ${status}):" >&2
            cat /tmp/release.json >&2
            exit 1
          fi

          release_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' /tmp/release.json)"

          # Re-runs must replace the asset, not fail on a name clash.
          stale="$(curl -sS -f -H "${auth}" "${api}/releases/${release_id}/assets" \
            | python3 -c 'import json,sys; n=sys.argv[1]; print(" ".join(str(a["id"]) for a in json.load(sys.stdin) if a["name"]==n))' "${apk}")"
          for asset_id in ${stale}; do
            echo "Removing stale asset ${asset_id}."
            curl -sS -f -X DELETE -H "${auth}" \
              "${api}/releases/${release_id}/assets/${asset_id}" -o /dev/null
          done

          curl -sS -f -X POST -H "${auth}" \
            -F "attachment=@${apk}" \
            "${api}/releases/${release_id}/assets?name=${apk}" -o /dev/null
          echo "Published ${apk} to ${SERVER}/${REPO}/releases/tag/${TAG}"
