name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Check the tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')"
          name="${version%%+*}"
          if [ "v${name}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version ${version} (expected v${name})." >&2
            exit 1
          fi
          echo "Building ${name} from tag ${GITHUB_REF_NAME}."

      - name: Install dependencies
        run: flutter pub get

      # The keystore is passed as content, never as a path: nothing has to exist
      # in the repository, and the workflow never writes the key to a tracked
      # location. Gradle decodes it into its disposable build/ directory.
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty; refusing to publish an unsigned build." >&2
            exit 1
          fi
          flutter build apk --release

      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          "${build_tools}/apksigner" verify --verbose \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Remove the decoded keystore
        if: always()
        run: rm -rf android/.gradle-signing

      - name: Resolve artifact name
        id: artifact
        run: |
          set -euo pipefail
          name="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')"
          echo "name=ljod-${name}" >> "${GITHUB_OUTPUT}"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
