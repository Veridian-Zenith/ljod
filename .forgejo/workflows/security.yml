name: Security

# Replaces the GitHub-only CodeQL workflow. `github/codeql-action` is not on
# Forgejo's action mirror and Forgejo has no code-scanning endpoint to upload
# results to, so the original workflow could not run here at all. This keeps the
# parts that are actionable for this repository, using nothing but the toolchain
# the build already needs: analysis at a stricter level than ci.yml, a guard
# against committed signing material, and a weekly dependency report.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '25 15 * * 0'
  workflow_dispatch:

# No permissions block: Forgejo does not support the `permissions` key and
# warns on every run, expecting capabilities to be granted through
# Authorized Integrations instead. Declaring it here did nothing.
env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  review:
    name: Security review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The runner's tool cache is unpacked under /opt/hostedtoolcache by
      # another user, so git exits 128 with "dubious ownership" — fatal both to
      # the setup action and to the Flutter tool's own git calls.
      - name: Trust the Flutter tool cache
        run: git config --global --add safe.directory '*'

      # Absolute URL: Forgejo's action mirror does not carry this action.
      - name: Set up Flutter
        uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `flutter pub get` resolves plugin platform implementations and exits 1 with
      # "No Android SDK found. Try setting the ANDROID_HOME environment variable."
      # when none is installed, so even the analysis-only jobs need an SDK; the APK
      # jobs need one to build regardless. This image ships none, so install it at the
      # level compileSdk asks for (37).
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          sdk="${RUNNER_TEMP:-${HOME:-/tmp}}/android-sdk"
          manager="${sdk}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "${manager}" ]; then
            echo "Installing Android command-line tools into ${sdk}."
            tmp="$(dirname "${sdk}")/tmp-tools"
            mkdir -p "${sdk}/cmdline-tools" "${tmp}/unpacked"
            curl -fsSL -o "${tmp}/cmdline-tools.zip" \
              "https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip"
            if command -v unzip > /dev/null; then
              unzip -q "${tmp}/cmdline-tools.zip" -d "${tmp}/unpacked"
            else
              python3 -m zipfile -e "${tmp}/cmdline-tools.zip" "${tmp}/unpacked"
            fi
            rm -rf "${sdk}/cmdline-tools/latest"
            mv "${tmp}/unpacked/cmdline-tools" "${sdk}/cmdline-tools/latest"
            rm -rf "${tmp}"
          fi

          # The licence prompts read stdin; `yes` answers them. It dies of SIGPIPE
          # once sdkmanager stops reading, which is expected and not a failure.
          yes | "${manager}" --sdk_root="${sdk}" --licenses > /dev/null || true

          # The NDK is required, not optional: the `jni` plugin compiles native
          # code with `flutter.ndkVersion`, which is 28.2.13676358 on Flutter
          # 3.47.9. Without it Gradle pulls ~1 GB from dl.google.com mid-build.
          "${manager}" --sdk_root="${sdk}" --install \
            "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" \
            "ndk;28.2.13676358"

          echo "ANDROID_HOME=${sdk}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${sdk}" >> "${GITHUB_ENV}"
          echo "Android SDK ready at ${sdk}"

      - name: Install dependencies
        run: flutter pub get

      # Stricter than ci.yml, which tolerates infos and warnings: this job is
      # the place where "no issues found" has to mean it.
      - name: Static analysis
        run: flutter analyze --fatal-warnings --fatal-infos

      - name: Verify no signing material is tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(jks|p12|keystore)$|(^|/)keystore/|key\.properties'; then
            echo "Signing material is tracked in git; it must never be committed." >&2
            exit 1
          fi
          echo "No signing material tracked."

      # Informational on purpose: a stale dependency is not a build failure, and
      # this repository has no Dependabot on Forgejo to report them otherwise.
      - name: Report outdated dependencies
        continue-on-error: true
        run: flutter pub outdated
